name: Build Asasec Il2cppDumper

on:
  workflow_dispatch:

  push:
    branches:
      - main


jobs:

  build:

    runs-on: macos-latest

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==================================================
      # XCODE VERSION
      # ==================================================

      - name: Show Xcode Version
        run: |
          echo "======================================"
          echo "Xcode Version"
          echo "======================================"

          xcodebuild -version

          echo ""

          xcode-select -p


      # ==================================================
      # GENERATE XCODE PROJECT
      # ==================================================

      - name: Generate Xcode Project
        run: |
          echo "======================================"
          echo "Generating Xcode Project"
          echo "======================================"

          python3 Scripts/generate_xcode_project.py

          echo ""

          echo "======================================"
          echo "Generated project.pbxproj"
          echo "======================================"

          ls -lh \
            "AsasecIl2cppDumper-Gui-App.xcodeproj/project.pbxproj"

          echo ""

          echo "Project directory:"
          find \
            "AsasecIl2cppDumper-Gui-App.xcodeproj" \
            -maxdepth 2 \
            -print


      # ==================================================
      # SHOW TARGETS
      # ==================================================

      - name: Verify Xcode Project
        run: |
          echo "======================================"
          echo "Verifying Xcode Project"
          echo "======================================"

          xcodebuild \
            -project "AsasecIl2cppDumper-Gui-App.xcodeproj" \
            -list

          echo ""

          echo "Project verification completed."


      # ==================================================
      # CLEAN
      # ==================================================

      - name: Clean Build
        run: |
          echo "======================================"
          echo "Clean Build"
          echo "======================================"

          xcodebuild \
            -project "AsasecIl2cppDumper-Gui-App.xcodeproj" \
            -target "AsasecIl2cppDumper-Gui-App" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            clean


      # ==================================================
      # BUILD
      # ==================================================

      - name: Build iOS App
        run: |
          echo "======================================"
          echo "Build iOS App"
          echo "======================================"

          xcodebuild \
            -project "AsasecIl2cppDumper-Gui-App.xcodeproj" \
            -target "AsasecIl2cppDumper-Gui-App" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=""

      
      # ==================================================
      # FIND APP
      # ==================================================

      - name: Find APP
        run: |
          echo "======================================"
          echo "Finding APP"
          echo "======================================"

          APP_PATH=$(find \
            "$GITHUB_WORKSPACE/build" \
            -type d \
            -name "AsasecIl2cppDumper-Gui-App.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then

            echo ""
            echo "HATA: .app bulunamadı!"

            echo ""
            echo "Build directory:"
            find \
              "$GITHUB_WORKSPACE/build" \
              -maxdepth 5 \
              -print

            exit 1

          fi

          echo ""
          echo "APP bulundu:"
          echo "$APP_PATH"

          echo ""

          echo "APP içeriği:"
          find \
            "$APP_PATH" \
            -maxdepth 3 \
            -print


      # ==================================================
      # CREATE IPA
      # ==================================================

      - name: Create IPA
        run: |
          echo "======================================"
          echo "Creating IPA"
          echo "======================================"

          APP_PATH=$(find \
            "$GITHUB_WORKSPACE/build" \
            -type d \
            -name "AsasecIl2cppDumper-Gui-App.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then

            echo "HATA: .app bulunamadı!"

            exit 1

          fi

          echo ""
          echo "APP:"
          echo "$APP_PATH"

          echo ""

          rm -rf \
            "$GITHUB_WORKSPACE/ipa"

          mkdir -p \
            "$GITHUB_WORKSPACE/ipa/Payload"

          echo "APP Payload içine kopyalanıyor..."

          cp -R \
            "$APP_PATH" \
            "$GITHUB_WORKSPACE/ipa/Payload/AsasecIl2cppDumper.app"

          echo ""

          echo "Payload:"
          find \
            "$GITHUB_WORKSPACE/ipa/Payload" \
            -maxdepth 3 \
            -print

          echo ""

          cd \
            "$GITHUB_WORKSPACE/ipa"

          echo "IPA oluşturuluyor..."

          zip -r \
            "$GITHUB_WORKSPACE/AsasecIl2cppDumper.ipa" \
            Payload

          echo ""

          echo "IPA oluşturuldu:"

          ls -lh \
            "$GITHUB_WORKSPACE/AsasecIl2cppDumper.ipa"


      # ==================================================
      # VERIFY IPA
      # ==================================================

      - name: Verify IPA
        run: |
          echo "======================================"
          echo "Verify IPA"
          echo "======================================"

          IPA_PATH="$GITHUB_WORKSPACE/AsasecIl2cppDumper.ipa"

          if [ ! -f "$IPA_PATH" ]; then

            echo ""
            echo "HATA: IPA oluşturulamadı!"

            echo ""
            echo "Mevcut IPA dosyaları:"

            find \
              "$GITHUB_WORKSPACE" \
              -maxdepth 4 \
              -name "*.ipa" \
              -print

            exit 1

          fi

          echo ""
          echo "IPA başarıyla oluşturuldu:"
          echo "$IPA_PATH"

          echo ""

          echo "IPA boyutu:"

          ls -lh \
            "$IPA_PATH"

          echo ""

          echo "IPA içeriği:"

          unzip -l \
            "$IPA_PATH"


      # ==================================================
      # UPLOAD IPA
      # ==================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4

        with:
          name: AsasecIl2cppDumper-IPA

          path: ${{ github.workspace }}/AsasecIl2cppDumper.ipa

          if-no-files-found: error
