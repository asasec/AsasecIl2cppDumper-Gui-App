name: Build Asasec Il2cppDumper

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ======================================
      # GENERATE XCODE PROJECT
      # ======================================

      - name: Generate Xcode Project
        run: |
          echo "======================================"
          echo "Generating Xcode Project"
          echo "======================================"

          python3 Scripts/generate_xcode_project.py

          echo ""
          echo "======================================"
          echo "Generated project.pbxproj"
          echo "======================================"

          ls -lh \
            AsasecIl2cppDumper-Gui-App.xcodeproj/project.pbxproj

          echo ""
          echo "Project directory:"

          find \
            AsasecIl2cppDumper-Gui-App.xcodeproj \
            -maxdepth 2 \
            -type f \
            -print

      # ======================================
      # XCODE VERSION
      # ======================================

      - name: Show Xcode Version
        run: |
          xcodebuild -version

      # ======================================
      # VERIFY PROJECT
      # ======================================

      - name: Verify Xcode Project
        run: |
          echo "======================================"
          echo "Verifying Xcode Project"
          echo "======================================"

          xcodebuild \
            -project "AsasecIl2cppDumper-Gui-App.xcodeproj" \
            -list

      # ======================================
      # CLEAN
      # ======================================

      - name: Clean Build
        run: |
          echo "======================================"
          echo "Clean Build"
          echo "======================================"

          xcodebuild \
            -project "AsasecIl2cppDumper-Gui-App.xcodeproj" \
            -scheme "AsasecIl2cppDumper-Gui-App" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            clean

      # ======================================
      # BUILD
      # ======================================

      - name: Build iOS App
        run: |
          echo "======================================"
          echo "Building iOS App"
          echo "======================================"

          xcodebuild \
            -project "AsasecIl2cppDumper-Gui-App.xcodeproj" \
            -scheme "AsasecIl2cppDumper-Gui-App" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=""

      # ======================================
      # FIND APP
      # ======================================

      - name: Find APP
        run: |
          echo "======================================"
          echo "Finding APP"
          echo "======================================"

          APP_PATH=$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name "AsasecIl2cppDumper-Gui-App.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "HATA: .app bulunamadı!"
            exit 1
          fi

          echo "APP bulundu:"
          echo "$APP_PATH"

          echo ""
          echo "APP içeriği:"

          find "$APP_PATH" \
            -maxdepth 2 \
            -print

      # ======================================
      # CREATE IPA
      # ======================================

      - name: Create IPA
        run: |
          echo "======================================"
          echo "Creating IPA"
          echo "======================================"

          APP_PATH=$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name "AsasecIl2cppDumper-Gui-App.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "HATA: .app bulunamadı!"
            exit 1
          fi

          echo "APP:"
          echo "$APP_PATH"

          rm -rf "$GITHUB_WORKSPACE/ipa"

          mkdir -p \
            "$GITHUB_WORKSPACE/ipa/Payload"

          cp -R \
            "$APP_PATH" \
            "$GITHUB_WORKSPACE/ipa/Payload/AsasecIl2cppDumper.app"

          cd "$GITHUB_WORKSPACE/ipa"

          zip -r \
            "$GITHUB_WORKSPACE/AsasecIl2cppDumper.ipa" \
            Payload

          echo ""
          echo "IPA oluşturuldu:"

          ls -lh \
            "$GITHUB_WORKSPACE/AsasecIl2cppDumper.ipa"

      # ======================================
      # VERIFY IPA
      # ======================================

      - name: Verify IPA
        run: |
          echo "======================================"
          echo "Verifying IPA"
          echo "======================================"

          IPA_PATH="$GITHUB_WORKSPACE/AsasecIl2cppDumper.ipa"

          if [ ! -f "$IPA_PATH" ]; then
            echo "HATA: IPA oluşturulamadı!"
            exit 1
          fi

          echo "IPA başarıyla oluşturuldu:"
          echo "$IPA_PATH"

          echo ""
          echo "IPA boyutu:"

          ls -lh "$IPA_PATH"

          echo ""
          echo "IPA içeriği:"

          unzip -l "$IPA_PATH"

      # ======================================
      # UPLOAD IPA
      # ======================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AsasecIl2cppDumper-IPA
          path: ${{ github.workspace }}/AsasecIl2cppDumper.ipa
          if-no-files-found: error
