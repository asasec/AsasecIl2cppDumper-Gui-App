name: Build Asasec Il2cppDumper

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:

  build:

    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: |
          xcodebuild -version

      - name: Clean Build
        run: |
          xcodebuild \
            -project "AsasecIl2cppDumper-Gui-App.xcodeproj" \
            -scheme "AsasecIl2cppDumper-Gui-App" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            clean

      - name: Build iOS App
        run: |
          xcodebuild \
            -project "AsasecIl2cppDumper-Gui-App.xcodeproj" \
            -scheme "AsasecIl2cppDumper-Gui-App" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=""

      - name: Find APP
        run: |
          echo "Build klasörleri:"
          find "$PWD/build" -type d -name "*.app" -print

      - name: Package APP
        run: |
          APP_PATH=$(find "$PWD/build" \
            -type d \
            -name "AsasecIl2cppDumper-Gui-App.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "HATA: .app dosyası bulunamadı!"
            exit 1
          fi

          echo "APP bulundu:"
          echo "$APP_PATH"

          rm -rf "$PWD/output"
          mkdir -p "$PWD/output"

          cp -R "$APP_PATH" \
            "$PWD/output/AsasecIl2cppDumper.app"

      - name: Create ZIP
        run: |
          cd "$PWD/output"

          zip -r \
            "../AsasecIl2cppDumper.zip" \
            "AsasecIl2cppDumper.app"

      - name: Check ZIP Contents
        run: |
          echo "ZIP içeriği:"
          unzip -l "$PWD/AsasecIl2cppDumper.zip"

      - name: Upload APP ZIP
        uses: actions/upload-artifact@v4

        with:
          name: AsasecIl2cppDumper
          path: AsasecIl2cppDumper.zip
          if-no-files-found: error
