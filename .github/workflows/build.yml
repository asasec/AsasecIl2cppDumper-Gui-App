name: Build Asasec Il2cppDumper

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:

  build:

    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Show Xcode Version
        run: |
          xcodebuild -version


      - name: Clean Build
        run: |
          xcodebuild \
            -project "AsasecIl2cppDumper-Gui-App.xcodeproj" \
            -scheme "AsasecIl2cppDumper-Gui-App" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            clean


      - name: Build iOS App
        run: |
          xcodebuild \
            -project "AsasecIl2cppDumper-Gui-App.xcodeproj" \
            -scheme "AsasecIl2cppDumper-Gui-App" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=""


      - name: Find APP
        run: |

          APP_PATH=$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name "AsasecIl2cppDumper-Gui-App.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "HATA: .app bulunamadı!"
            exit 1
          fi

          echo "APP bulundu:"
          echo "$APP_PATH"

          echo ""
          echo "APP içeriği:"

          find "$APP_PATH" -maxdepth 2 -print


      - name: Create IPA
        run: |

          APP_PATH=$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name "AsasecIl2cppDumper-Gui-App.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "HATA: .app bulunamadı!"
            exit 1
          fi

          echo "APP:"
          echo "$APP_PATH"

          echo ""

          rm -rf "$GITHUB_WORKSPACE/ipa"

          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"

          echo "APP Payload içine kopyalanıyor..."

          cp -R \
            "$APP_PATH" \
            "$GITHUB_WORKSPACE/ipa/Payload/AsasecIl2cppDumper.app"

          echo ""

          echo "Payload içeriği:"

          find "$GITHUB_WORKSPACE/ipa/Payload" -maxdepth 3 -print

          echo ""

          echo "IPA oluşturuluyor..."

          cd "$GITHUB_WORKSPACE/ipa"

          zip -r \
            "$GITHUB_WORKSPACE/AsasecIl2cppDumper.ipa" \
            Payload

          echo ""

          echo "IPA oluşturuldu:"

          ls -lh "$GITHUB_WORKSPACE/AsasecIl2cppDumper.ipa"


      - name: Verify IPA
        run: |

          IPA_PATH="$GITHUB_WORKSPACE/AsasecIl2cppDumper.ipa"

          echo "Kontrol edilen IPA:"
          echo "$IPA_PATH"

          if [ ! -f "$IPA_PATH" ]; then

            echo ""
            echo "HATA: IPA oluşturulamadı!"

            echo ""
            echo "GITHUB_WORKSPACE:"
            echo "$GITHUB_WORKSPACE"

            echo ""
            echo "Mevcut dosyalar:"

            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -name "*.ipa" \
              -print

            exit 1
          fi

          echo ""
          echo "IPA başarıyla oluşturuldu:"
          echo "$IPA_PATH"

          echo ""
          echo "IPA boyutu:"

          ls -lh "$IPA_PATH"

          echo ""
          echo "IPA içeriği:"

          unzip -l "$IPA_PATH"


      - name: Upload IPA
        uses: actions/upload-artifact@v4

        with:

          name: AsasecIl2cppDumper-IPA

          path: ${{ github.workspace }}/AsasecIl2cppDumper.ipa

          if-no-files-found: error
